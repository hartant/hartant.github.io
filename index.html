    <script>
      // Apply the saved theme before the page paints. Light is the default.
      try {
        var t = localStorage.getItem('theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
